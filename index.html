<noscript><h1>Starfind ― 空にかざして星を探す</h1><p>スマホを空にかざすだけで、星や星座、惑星の名前が分かる無料・広告なしの星座アプリです。はくちょう座、デネブ、夏の大三角、北極星などの探し方を案内します。JavaScriptを有効にしてお使いください。</p><h2>デネブは何光年先にあるの？</h2><p>はくちょう座の尾にあたる1等星デネブは、遠すぎて距離が正確に測りにくい星です。推定には幅があり、およそ1,400〜2,600光年とされています。それでも肉眼ではっきり見えるのは、太陽の何万倍も明るく輝いているからです。</p><h2>アルビレオはなぜ金と青に見えるの？</h2><p>はくちょう座のくちばしにあたるアルビレオは、望遠鏡で見ると金色と青の二つの星に分かれる二重星で、「天上の宝石」とも呼ばれます。金色の星は表面温度が低いオレンジ色の巨星、青い星は高温の星です。並んでいるので色の違いが際立ちます。肉眼では一つの星に見えます。距離はおよそ430光年です。</p><h2>昔はデネブが北極星だったって本当？</h2><p>地球の自転軸は、コマの首振りのように約2万6千年かけてゆっくり向きを変えます（歳差運動）。そのため「北極星」になる星は時代ごとに入れ替わります。今はポラリス、約5千年前はりゅう座のトゥバン、約1万2千〜1万4千年前はベガの近くでした。デネブの近くを天の北極が通ったのは一万数千年以上前で、はくちょう座が星空の中央にあった時代です。西暦1万年ごろにも、再びデネブの近くを通ります。</p><h2>はくちょう座の方角から「暗黒物質の風」が吹いているって本当？</h2><p>太陽系は天の川銀河の中を、はくちょう座の方向へ秒速約230kmで動いています。銀河を満たしていると考えられている暗黒物質から見ると、地球には、はくちょう座の方角から向かい風が吹いていることになります。この「暗黒物質の風」の向きをとらえようとする実験が、世界で進められています（まだ検出はされていません）。</p><h2>夏の大三角はどうやって探すの？</h2><p>夏から秋の宵、空の高い所に、こと座のベガ、わし座のアルタイル、はくちょう座のデネブの三つの1等星で大きな三角形ができます。いちばん明るいのがベガ、天の川をはさんで向かいがアルタイル、天の川の中にあるのがデネブです。ベガとアルタイルは七夕の織姫と彦星です。</p></noscript>
